# DSH bundle profile patch.
# This makes the plugin installable AND active via:
#   dsh plugin add github:TindalosKorone/dsh-cheatengine
# `id`   = the Cordis plugin id (see `export const name` in src/index.ts)
# `name` = the npm package name (resolved from node_modules after install)
- insert:
    - id: '@dsh-external/dsh-cheatengine'
      name: '@dsh-external/dsh-cheatengine'
